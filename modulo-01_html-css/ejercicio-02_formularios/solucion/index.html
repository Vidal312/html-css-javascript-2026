<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de contacto</title>
</head>
<body>
    <header>
        <img src="logo.png" alt="Logo del blog Historia de la Web">
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Articulos</a>
            <a href="#">Contacto</a>
            <a href="#">Noticias</a>
        </nav>  
    </header>

    <main>

        <h1>Página de contacto</h1>
        <form action="/enviar" method="POST">

            <fieldset>
                
                <legend> Datos Personales</legend>
                
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono">

            </fieldset>

            <fieldset>

                <legend>Tipo de Consulta</legend>
                
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"></textarea>
                
                
                <label for="consulta">Motivo</label>                
                <select id="consulta" name="consulta">
                    
                    <option value="soporte">Soporte</option>
                    <option value="ventas">Ventas</option>
                    <option value="general">Consulta General</option>
                    
                </select>
                
            </fieldset>
                
            <fieldset>

                <legend>Preferencias</legend>

                <p>Prioridad</p>

                <input type="radio" id="alta" name="prioridad" value="alta">
                 <label for="alta">Alta</label>

                <input type="radio" id="media" name="prioridad" value="media">
                <label for="media">Media</label>

                <br>

                <input type="checkbox" id="acepto" name="acepto">
                <label for="acepto">
                    Acepto los términos y condiciones
                </label>


            </fieldset>

            <input type="submit" value="Enviar">

        </form>
    </main>
</body>
</html>
